```
<!-- TOPBAR -->
<header class="chat-topbar">

    <a href="index.html" class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        VGRO AI
    </a>

    <div class="chat-topbar-actions">

        <span
            class="model-pill"
            data-i18n="chat.settingsModelValue"
        >
            VGRO AI
        </span>

        <button
            class="icon-btn"
            id="sidebarToggle"
            type="button"
            aria-label="Toggle chat history"
            title="History"
        >
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <line x1="9" y1="4" x2="9" y2="20"></line>
            </svg>
        </button>

        <button
            class="icon-btn"
            id="settingsBtn"
            type="button"
            aria-label="Open settings"
            title="Settings"
        >
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09c0 .68.39 1.29 1 1.51.59.23 1.27.11 1.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.23.59.11 1.27.33 1.82"></path>
            </svg>
        </button>

        <button
            class="icon-btn"
            id="logoutBtn"
            type="button"
            title="Log out"
            aria-label="Log out"
        >
            ↪
        </button>

        <a
            href="index.html"
            class="icon-btn"
            aria-label="Back to home"
            title="Home"
        >
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <path d="M3 12l9-9 9 9"></path>
                <path d="M5 10v10h14V10"></path>
            </svg>
        </a>

    </div>
</header>


<!-- CHAT SHELL -->
<div class="chat-shell">

    <div
        class="sidebar-backdrop"
        id="sidebarBackdrop"
    ></div>


    <!-- SIDEBAR -->
    <aside
        class="chat-sidebar"
        id="chatSidebar"
    >

        <button
            class="new-chat-btn"
            id="newChatBtn"
            type="button"
        >
            <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
            >
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>

            <span data-i18n="chat.newChat">
                New Chat
            </span>
        </button>


        <div
            class="sidebar-section"
            style="flex: 1;"
        >

            <h6 data-i18n="chat.recent">
                Recent Chats
            </h6>

            <div
                class="chat-history"
                id="chatHistory"
            ></div>

        </div>


        <!-- SIDEBAR FOOTER -->
        <div class="sidebar-footer">

            <button
                class="sidebar-link"
                id="clearChatBtn"
                type="button"
            >
                <svg
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14H6L5 6"></path>
                    <path d="M10 11v6M14 11v6"></path>
                </svg>

                <span data-i18n="chat.clearChat">
                    Clear Chat
                </span>
            </button>


            <button
                class="sidebar-link"
                id="settingsBtnAlt"
                type="button"
                onclick="document.getElementById('settingsBtn').click()"
            >
                <svg
                    width="15"
                    height="15"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                >
                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                    ></circle>
                </svg>

                <span data-i18n="chat.settings">
                    Settings
                </span>
            </button>

        </div>

    </aside>


    <!-- MAIN CHAT -->
    <section class="chat-main">

        <div
            class="chat-scroll"
            id="chatScroll"
        ></div>


        <div class="chat-input-area">

            <form
                class="chat-input-box"
                id="chatForm"
            >

                <textarea
                    id="chatInput"
                    rows="1"
                    placeholder="Ask VGRO anything..."
                    data-i18n-placeholder="chat.inputPlaceholder"
                ></textarea>


                <button
                    type="submit"
                    class="send-btn"
                    id="sendBtn"
                    aria-label="Send message"
                    data-i18n-aria="chat.send"
                    disabled
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <line
                            x1="22"
                            y1="2"
                            x2="11"
                            y2="13"
                        ></line>

                        <polygon
                            points="22 2 15 22 11 13 2 9 22 2"
                        ></polygon>
                    </svg>
                </button>

            </form>


            <p class="input-hint">
                Enter ↵ · Shift + Enter ⏎
            </p>

        </div>

    </section>

</div>


<!-- SETTINGS MODAL -->
<div
    class="modal-overlay"
    id="settingsModal"
>

    <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settingsTitle"
    >

        <button
            class="modal-close"
            id="settingsClose"
            type="button"
            aria-label="Close settings"
        >
            ✕
        </button>


        <h3
            id="settingsTitle"
            data-i18n="chat.settings"
        >
            Settings
        </h3>


        <!-- THEME -->
        <div class="field-group">

            <label data-i18n="chat.settingsTheme">
                Theme
            </label>

            <div class="segmented">

                <button
                    type="button"
                    data-theme-option="dark"
                    data-i18n="chat.settingsThemeDark"
                >
                    Dark
                </button>

                <button
                    type="button"
                    data-theme-option="light"
                    data-i18n="chat.settingsThemeLight"
                >
                    Light
                </button>

            </div>

        </div>


        <!-- LANGUAGE -->
        <div class="field-group">

            <label data-i18n="chat.settingsLanguage">
                Language
            </label>

            <div class="segmented">

                <button
                    type="button"
                    data-lang-option="auto"
                    data-i18n="chat.settingsLangAuto"
                >
                    Auto Detect
                </button>

                <button
                    type="button"
                    data-lang-option="id"
                    data-i18n="chat.settingsLangId"
                >
                    Bahasa Indonesia
                </button>

                <button
                    type="button"
                    data-lang-option="en"
                    data-i18n="chat.settingsLangEn"
                >
                    English
                </button>

            </div>

        </div>


        <!-- MODEL -->
        <div class="field-group">

            <label>
                <span data-i18n="chat.settingsModel">
                    Model
                </span>

                <span class="badge-soon">
                    AI
                </span>
            </label>

            <select
                class="select-field"
                disabled
            >
                <option data-i18n="chat.settingsModelValue">
                    VGRO AI
                </option>
            </select>

        </div>


        <!-- TEMPERATURE -->
        <div class="field-group">

            <label>
                <span data-i18n="chat.settingsTemp">
                    Temperature
                </span>

                <span class="badge-soon">
                    AI
                </span>
            </label>

            <input
                type="range"
                min="0"
                max="100"
                value="70"
                disabled
            >

        </div>

    </div>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>


<!-- TRANSLATION -->
<script src="js/translations.js"></script>


<!-- CHAT -->
<script src="js/chat.js"></script>
<script src="js/migrate-history.js"></script>


<!-- SUPABASE AUTH GUARD + LOGOUT -->
<script>
    document.addEventListener("DOMContentLoaded", async () => {

        if (
            typeof supabaseClient === "undefined" ||
            !supabaseClient
        ) {
            console.error("Supabase client belum tersedia.");
            return;
        }

        const {
            data: { session },
            error
        } = await supabaseClient.auth.getSession();

        if (error) {
            console.error("Gagal mengecek session:", error);
            return;
        }

        if (!session) {
            window.location.replace("auth.html");
            return;
        }

        console.log(
            "VGRO AI login sebagai:",
            session.user.email
        );

        if (typeof window.VGRO_MIGRATE_HISTORY === "function") {
            window.VGRO_MIGRATE_HISTORY(session);
        }


        const logoutBtn =
            document.getElementById("logoutBtn");

        if (logoutBtn) {

            logoutBtn.addEventListener(
                "click",
                async () => {

                    const { error } =
                        await supabaseClient.auth.signOut();

                    if (error) {

                        console.error(
                            "Logout gagal:",
                            error
                        );

                        return;
                    }

                    window.location.replace(
                        "auth.html"
                    );
                }
            );

        }

    });
</script>
