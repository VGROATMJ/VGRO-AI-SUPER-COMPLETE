<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VGRO AI Workspace</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%238B5CF6%22/></svg>" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/chat.css" />
</head>
<body class="chat-body" data-theme="dark">
<script>if(!localStorage.getItem("vgro:user")){location.replace("auth.html")}</script>

<header class="chat-topbar">
  <a href="index.html" class="brand"><span class="brand-dot" aria-hidden="true"></span> VGRO AI</a>

  <div class="chat-topbar-actions">
    <span class="model-pill" data-i18n="chat.settingsModelValue">VGRO Local</span>
    <button class="icon-btn" id="sidebarToggle" aria-label="Toggle chat history" title="History">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Open settings" title="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09c0 .68.39 1.29 1 1.51.59.23 1.27.11 1.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.23.59.11 1.27.33 1.82"/></svg>
    </button>
    <button class="icon-btn" id="logoutBtn" title="Log out" aria-label="Log out">↪</button>
    <a href="index.html" class="icon-btn" data-i18n-aria="chat.backToHome" aria-label="Back to home" title="Home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
    </a>
  </div>
</header>

<div class="chat-shell">
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="chat-sidebar" id="chatSidebar">
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span data-i18n="chat.newChat">New Chat</span>
    </button>

    <div class="sidebar-section" style="flex:1;">
      <h6 data-i18n="chat.recent">Recent Chats</h6>
      <div class="chat-history" id="chatHistory"></div>
    </div>

    <div class="sidebar-footer">
      <button class="sidebar-link" id="clearChatBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        <span data-i18n="chat.clearChat">Clear Chat</span>
      </button>
      <button class="sidebar-link" id="settingsBtnAlt" onclick="document.getElementById('settingsBtn').click()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>
        <span data-i18n="chat.settings">Settings</span>
      </button>
    </div>
  </aside>

  <section class="chat-main">
    <div class="chat-scroll" id="chatScroll"></div>

    <div class="chat-input-area">
      <form class="chat-input-box" id="chatForm">
        <textarea id="chatInput" rows="1" data-i18n-placeholder="chat.inputPlaceholder" placeholder="Ask VGRO anything..."></textarea>
        <button type="submit" class="send-btn" id="sendBtn" data-i18n-aria="chat.send" aria-label="Send message" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </form>
      <p class="input-hint">Enter ↵ · Shift + Enter ⏎</p>
    </div>
  </section>
</div>

<!-- SETTINGS MODAL -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <button class="modal-close" id="settingsClose" aria-label="Close settings">✕</button>
    <h3 id="settingsTitle" data-i18n="chat.settings">Settings</h3>

    <div class="field-group">
      <label data-i18n="chat.settingsTheme">Theme</label>
      <div class="segmented">
        <button type="button" data-theme-option="dark" data-i18n="chat.settingsThemeDark">Dark</button>
        <button type="button" data-theme-option="light" data-i18n="chat.settingsThemeLight">Light</button>
      </div>
    </div>

    <div class="field-group">
      <label data-i18n="chat.settingsLanguage">Language</label>
      <div class="segmented">
        <button type="button" data-lang-option="auto" data-i18n="chat.settingsLangAuto">Auto Detect</button>
        <button type="button" data-lang-option="id" data-i18n="chat.settingsLangId">Bahasa Indonesia</button>
        <button type="button" data-lang-option="en" data-i18n="chat.settingsLangEn">English</button>
      </div>
    </div>

    <div class="field-group">
      <label><span data-i18n="chat.settingsModel">Model</span> <span class="badge-soon" data-i18n="chat.comingSoon">Coming with backend integration</span></label>
      <select class="select-field" disabled>
        <option data-i18n="chat.settingsModelValue">VGRO Local</option>
      </select>
    </div>

    <div class="field-group">
      <label><span data-i18n="chat.settingsTemp">Temperature</span> <span class="badge-soon" data-i18n="chat.comingSoon">Coming with backend integration</span></label>
      <input type="range" min="0" max="100" value="70" disabled />
    </div>
  </div>
</div>

<script src="js/translations.js"></script>
<script src="js/chat.js"></script><script>document.getElementById("logoutBtn")?.addEventListener("click",()=>{localStorage.removeItem("vgro:user");location.href="index.html"});</script>
</body>
</html>
